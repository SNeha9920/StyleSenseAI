{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Create Account | StyleSense AI</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Bootstrap Icons -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
        rel="stylesheet"
    >

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{% static 'css/style1.css' %}">

</head>


<body>


<div class="auth-page">

    <div class="auth-card">

        <h1>
            Create Account
        </h1>

        <p class="auth-subtitle">
            Start your AI beauty & fashion journey
        </p>


        <form id="registerForm" method="POST">
            {% csrf_token %}


            <!-- FULL NAME -->

            <div class="mb-3">

                <label
                    for="fullName"
                    class="form-label"
                >
                    Full Name
                </label>

                <input
                    type="text"
                    id="fullName"
                    name="fullName"
                    class="form-control"
                    placeholder="Enter your name"
                    required
                >

            </div>


            <!-- EMAIL -->

            <div class="mb-3">

                <label
                    for="registerEmail"
                    class="form-label"
                >
                    Email
                </label>

                <input
                    type="email"
                    id="registerEmail"
                    name="email"
                    class="form-control"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <!-- PASSWORD -->

            <div class="mb-4">

                <label
                    for="registerPassword"
                    class="form-label"
                >
                    Password
                </label>

                <input
                    type="password"
                    name="password"
                    id="registerPassword"
                    class="form-control"
                    placeholder="Create a password"
                    required
                >

            </div>


            <!-- CREATE ACCOUNT -->

            <button
                type="submit"
                class="btn btn-dark w-100 auth-button"
            >
                Create Account
            </button>


            <!-- MESSAGE -->

            <div
                id="registerMessage"
                class="auth-message"
            ></div>


        </form>


        <div class="auth-footer">

            Already have an account?

            <a href="{% url 'login' %}">
                Login
            </a>

        </div>

    </div>

</div>


<script src="{% static 'js/app1.js' %}"></script>

</body>

</html>
