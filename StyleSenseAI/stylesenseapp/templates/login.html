{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login | StyleSense AI</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Bootstrap Icons -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
        rel="stylesheet"
    >

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{% static 'css/style1.css' %}">

</head>


<body>


<div class="auth-page">

    <div class="auth-card">

        <h1>
            Welcome Back
        </h1>

        <p class="auth-subtitle">
            Login to your StyleSense AI account
        </p>


        <form id="loginForm" method="POST">
            {% csrf_token %}

            <!-- EMAIL -->

            <div class="mb-4">

                <label
                    for="loginEmail"
                    class="form-label"
                >
                    Email
                </label>

                <input
                    type="email"
                    name="email"
                    id="loginEmail"
                    class="form-control"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <!-- PASSWORD -->

            <div class="mb-4">

                <label
                    for="loginPassword"
                    class="form-label"
                >
                    Password
                </label>

                <input
                    type="password"
                    name="password"
                    id="loginPassword"
                    class="form-control"
                    placeholder="Enter your password"
                    required
                >

            </div>


            <!-- LOGIN BUTTON -->

            <button
                type="submit"
                class="btn btn-dark w-100 auth-button"
            >
                Login
            </button>


            <!-- MESSAGE -->

            <div
                id="loginMessage"
                class="auth-message"
            ></div>

        </form>


        <div class="auth-footer">

            Don't have an account?

            <a href="{% url 'register' %}">
                Register
            </a>

        </div>

    </div>

</div>


<script src="{% static 'js/app1.js' %}"></script>

</body>

</html>
