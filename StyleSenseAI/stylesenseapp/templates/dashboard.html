{% load static %}

<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Dashboard - StyleSense AI</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="{% static 'css/style.css' %}">

</head>

<body>

<main class="main">

    <h1 class="page-title">
        Dashboard
    </h1>

    <div class="row g-4">

        <!-- Skin Analysis -->

        <div class="col-lg-4 col-md-6">

            <a href="{% url 'skinanalysis' %}">

                <div class="card-custom dashboard-card">

                    <div class="dashboard-icon">
                        <i class="bi bi-camera"></i>
                    </div>

                    <div class="card-title">
                        Skin Analysis
                    </div>

                    <div class="card-text">
                        Analyze your skin using AI.
                    </div>

                </div>

            </a>

        </div>


        <!-- Virtual Try-On -->

        <div class="col-lg-4 col-md-6">

            <a href="{% url 'virtualtryon' %}">

                <div class="card-custom dashboard-card">

                    <div class="dashboard-icon">
                        <i class="bi bi-tshirt"></i>
                    </div>

                    <div class="card-title">
                        Virtual Try-On
                    </div>

                    <div class="card-text">
                        Try outfits virtually.
                    </div>

                </div>

            </a>

        </div>


        <!-- AI Stylist -->

        <div class="col-lg-4 col-md-6">

            <a href="{% url 'aistylist' %}">

                <div class="card-custom dashboard-card">

                    <div class="dashboard-icon">
                        <i class="bi bi-stars"></i>
                    </div>

                    <div class="card-title">
                        AI Stylist
                    </div>

                    <div class="card-text">
                        Get fashion recommendations.
                    </div>

                </div>

            </a>

        </div>


        <!-- Wardrobe -->

        <div class="col-lg-4 col-md-6">

            <a href="{% url 'wardrobe' %}">

                <div class="card-custom dashboard-card">

                    <div class="dashboard-icon">
                        <i class="bi bi-book"></i>
                    </div>

                    <div class="card-title">
                        Wardrobe
                    </div>

                    <div class="card-text">
                        Manage your clothes.
                    </div>

                </div>

            </a>

        </div>


        <!-- Profile -->

        <div class="col-lg-4 col-md-6">

            <a href="{% url 'profile' %}">

                <div class="card-custom dashboard-card">

                    <div class="dashboard-icon">
                        <i class="bi bi-person"></i>
                    </div>

                    <div class="card-title">
                        Profile
                    </div>

                    <div class="card-text">
                        Update your account.
                    </div>

                </div>

            </a>

        </div>


        <!-- History -->

        <div class="col-lg-4 col-md-6">

            <a href="{% url 'history' %}">

                <div class="card-custom dashboard-card">

                    <div class="dashboard-icon">
                        <i class="bi bi-clock-history"></i>
                    </div>

                    <div class="card-title">
                        History
                    </div>

                    <div class="card-text">
                        See previous analyses.
                    </div>

                </div>

            </a>

        </div>

    </div>

</main>


<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

<script src="{% static 'js/app.js' %}"></script>

</body>

</html>
